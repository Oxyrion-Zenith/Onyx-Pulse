name: Unzip and commit

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip archive
        run: |
          unzip -o grok-workspace.zip -d .
          rm grok-workspace.zip

      - name: Remove build output
        run: rm -rf .vercel

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract project from grok-workspace.zip (excluding .vercel build output)" || echo "Nothing to commit"
          git push
